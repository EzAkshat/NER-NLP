[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-app"
version = "0.1.0"
description = "Local, privacy-focused English named entity recognition for documents"
requires-python = ">=3.10"
dependencies = [
    "flair>=0.15,<0.16",
    "pydantic>=2.5,<3",
    "markdown-it-py>=3,<5",
    "python-docx>=1.1",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
ner-app = "ner_app.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]